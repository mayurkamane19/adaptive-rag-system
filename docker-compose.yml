version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - VECTOR_DB_PATH=data/vectorstore
      - DOCUMENTS_PATH=data/documents
      - CONVERSATIONS_PATH=data/conversations
      - EVALUATION_DATASET_PATH=data/evaluation/eval_dataset.json
      - ALLOWED_ORIGINS=*
      - DEBUG=false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: adaptive-rag-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional local Ollama server container (profile: with-ollama)
  # Launch with: docker compose --profile with-ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: adaptive-rag-ollama
    restart: unless-stopped
    profiles:
      - with-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
